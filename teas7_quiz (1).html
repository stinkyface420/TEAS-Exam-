<head>

<title>TEAS 7 Practice Exam</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:1.5rem 1rem;}
.shell{display:flex;gap:1rem;max-width:960px;width:100%;align-items:flex-start;}

/* Sidebar */
.sidebar{width:160px;flex-shrink:0;background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.07);padding:1rem;position:sticky;top:1.5rem;}
.sidebar h3{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.75rem;}
.nav-btn{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;border-radius:8px;border:1.5px solid #e8e8e8;background:#fff;color:#555;font-size:13px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover{background:#f0f4ff;border-color:#3b7cf4;color:#3b7cf4;}
.nav-btn.active{background:#3b7cf4;border-color:#3b7cf4;color:#fff;font-weight:500;}
.nav-btn.done{background:#f0fdf4;border-color:#a8e6cf;color:#1a6b4a;}
.nav-btn.done.active{background:#3b7cf4;border-color:#3b7cf4;color:#fff;}
.nav-divider{height:1px;background:#f0f0f0;margin:10px 0;}
.nav-restart{display:block;width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid #fcd5d5;background:#fff;color:#c0392b;font-size:12px;cursor:pointer;text-align:left;margin-top:4px;}
.nav-restart:hover{background:#fff0f0;}

/* Main card */
.card{flex:1;background:#fff;border-radius:16px;box-shadow:0 2px 16px rgba(0,0,0,0.08);padding:1.75rem;min-width:0;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;}
h1{font-size:20px;font-weight:600;color:#1a1a1a;}
.header-badge{font-size:12px;padding:4px 12px;border-radius:20px;background:#eef3ff;color:#3b7cf4;border:1px solid #c7d9fd;font-weight:500;}

/* Progress */
.progress-wrap{margin-bottom:1.25rem;}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:#aaa;margin-bottom:5px;}
.progress-bar-bg{height:5px;background:#eee;border-radius:3px;}
.progress-bar-fill{height:5px;background:#3b7cf4;border-radius:3px;transition:width 0.4s;}

/* Passage */
.passage-box{background:#fafafa;border:1px solid #e8e8e8;border-radius:10px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;}
.passage-title{font-size:12px;font-weight:600;color:#3b7cf4;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.75rem;}
.passage-text{font-size:15px;color:#222;line-height:1.75;white-space:pre-wrap;}

/* Chart */
.chart-wrap{background:#fafafa;border:1px solid #e8e8e8;border-radius:10px;padding:1rem 1.125rem;margin-bottom:1.125rem;}
.chart-title{font-size:12px;font-weight:600;color:#3b7cf4;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:0.75rem;text-align:center;}

/* Question */
.q-text{font-size:15px;font-weight:500;color:#1a1a1a;margin:0 0 1rem;line-height:1.6;}
.option-btn{display:block;width:100%;text-align:left;padding:11px 15px;margin-bottom:8px;border-radius:10px;border:1.5px solid #e4e4e4;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;transition:background 0.15s,border-color 0.15s;line-height:1.4;}
.option-btn:hover:not(:disabled){background:#f5f7ff;border-color:#3b7cf4;}
.option-btn.selected{border-color:#3b7cf4;background:#eef3ff;color:#1a4db0;}
.option-btn.correct{border-color:#22a06b;background:#e3f9f0;color:#1a6b4a;font-weight:500;}
.option-btn.incorrect{border-color:#e03e3e;background:#fff0f0;color:#a02020;}
.option-btn:disabled{cursor:not-allowed;}
.feedback{margin-top:0.75rem;padding:11px 15px;border-radius:10px;font-size:14px;line-height:1.5;}
.feedback.right{background:#e3f9f0;color:#1a6b4a;border:1px solid #a8e6cf;}
.feedback.wrong{background:#fff0f0;color:#a02020;border:1px solid #f5b8b8;}

/* Button row */
.btn-row{display:flex;gap:9px;margin-top:1rem;flex-wrap:wrap;align-items:center;}
.btn-primary{padding:10px 22px;border-radius:10px;border:none;background:#3b7cf4;color:#fff;font-size:14px;font-weight:500;cursor:pointer;}
.btn-primary:hover:not(:disabled){background:#2563eb;}
.btn-primary:disabled{background:#b0c4f8;cursor:not-allowed;}
.btn-secondary{padding:10px 22px;border-radius:10px;border:1.5px solid #e4e4e4;background:#fff;color:#1a1a1a;font-size:14px;cursor:pointer;}
.btn-secondary:hover{background:#f5f5f5;}
.btn-back{padding:10px 16px;border-radius:10px;border:1.5px solid #e4e4e4;background:#fff;color:#888;font-size:14px;cursor:pointer;}
.btn-back:hover{background:#f5f5f5;color:#555;}

/* Explanation box */
.explanation-box{margin-top:10px;background:#f8f9ff;border:1px solid #d0dbff;border-radius:10px;padding:12px 16px;}
.explanation-title{font-size:12px;font-weight:600;color:#3b7cf4;margin-bottom:7px;letter-spacing:0.02em;}
.explanation-text{font-size:14px;color:#333;line-height:1.65;}
.explanation-loading{font-size:13px;color:#888;display:flex;align-items:center;gap:8px;}
.exp-spinner{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:#3b7cf4;border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Section complete */
.section-complete{text-align:center;padding:2rem 1rem;}
.section-complete h2{font-size:20px;font-weight:600;margin-bottom:0.4rem;color:#1a1a1a;}
.section-complete p{font-size:14px;color:#555;margin-bottom:1.25rem;}
.section-score-big{font-size:52px;font-weight:700;color:#3b7cf4;line-height:1;}
.section-score-sub{font-size:14px;color:#888;margin:0.3rem 0 1.25rem;}

/* Final results */
.results-wrap{padding:0.5rem 0;}
.results-header{text-align:center;margin-bottom:1.5rem;}
.results-pct{font-size:64px;font-weight:700;color:#1a1a1a;line-height:1;}
.results-sub{font-size:16px;color:#555;margin:0.4rem 0 1rem;}
.results-pills{display:flex;gap:12px;justify-content:center;margin-bottom:1.5rem;flex-wrap:wrap;}
.rpill{padding:7px 18px;border-radius:20px;font-size:14px;font-weight:500;}
.rpill.s{background:#e3f9f0;color:#1a6b4a;}
.rpill.d{background:#fff0f0;color:#a02020;}
.results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.5rem;}
.results-cell{background:#f8f9fb;border-radius:10px;padding:14px;text-align:center;}
.results-cell .rc-label{font-size:12px;color:#888;margin-bottom:3px;}
.results-cell .rc-val{font-size:22px;font-weight:600;color:#1a1a1a;}
.results-cell .rc-sub{font-size:11px;color:#aaa;margin-top:2px;}

/* Review table */
.review-section{margin-bottom:1.5rem;}
.review-section h3{font-size:14px;font-weight:600;color:#444;margin-bottom:0.6rem;padding-bottom:5px;border-bottom:1px solid #f0f0f0;}
.review-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f8f8f8;font-size:13px;}
.review-item:last-child{border-bottom:none;}
.ri-icon{flex-shrink:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px;}
.ri-icon.c{background:#e3f9f0;color:#1a6b4a;}
.ri-icon.w{background:#fff0f0;color:#a02020;}
.ri-q{color:#333;line-height:1.45;flex:1;}
.ri-ans{font-size:12px;color:#888;margin-top:2px;}
.ri-ans span{color:#a02020;}
.ri-ans b{color:#1a6b4a;}

@media(max-width:620px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;position:static;display:flex;flex-wrap:wrap;gap:6px;padding:0.75rem;}
  .sidebar h3{width:100%;}
  .nav-btn{width:auto;flex:1;text-align:center;}
  .nav-divider{width:100%;}
  .nav-restart{width:100%;}
}

<script>
// ─── CHOIR CHART SVG ─────────────────────────────────────────────────────────
function choirChartSVG() {
  const data = [
    { grade:'9th', total:48, male:39, female:56 },
    { grade:'10th', total:38, male:28, female:48 },
    { grade:'11th', total:50, male:37, female:62 },
    { grade:'12th', total:39, male:20, female:58 }
  ];
  const W=520, H=220, pad={top:20,right:20,bottom:30,left:30};
  const chartW=W-pad.left-pad.right, chartH=H-pad.top-pad.bottom;
  const maxVal=70, groupW=chartW/4, barW=groupW/4.2;
  const colors={total:'#b0bec5',male:'#1a4db0',female:'#e91e8c'};
  const yLines=[0,20,40,60,80];

  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:520px;display:block;margin:auto;">`;

  // grid lines & y-labels
  yLines.forEach(v=>{
    const y=pad.top+chartH-(v/maxVal)*chartH;
    svg+=`<line x1="${pad.left}" y1="${y}" x2="${W-pad.right}" y2="${y}" stroke="#e8e8e8" stroke-width="1"/>`;
    svg+=`<text x="${pad.left-4}" y="${y+4}" text-anchor="end" font-size="10" fill="#999">${v}%</text>`;
  });

  // bars
  data.forEach((d,gi)=>{
    const gx=pad.left+gi*groupW+groupW*0.1;
    const bars=[
      {val:d.total,col:colors.total,x:0},
      {val:d.male,col:colors.male,x:barW+2},
      {val:d.female,col:colors.female,x:(barW+2)*2}
    ];
    bars.forEach(b=>{
      const bh=(b.val/maxVal)*chartH;
      const bx=gx+b.x, by=pad.top+chartH-bh;
      svg+=`<rect x="${bx}" y="${by}" width="${barW}" height="${bh}" fill="${b.col}" rx="2"/>`;
      svg+=`<text x="${bx+barW/2}" y="${by-3}" text-anchor="middle" font-size="9" fill="#555">${b.val}</text>`;
    });
    // grade label
    svg+=`<text x="${gx+barW+2}" y="${H-5}" text-anchor="middle" font-size="11" fill="#444">${d.grade}</text>`;
  });

  // legend
  const leg=[{col:colors.total,label:'TOTAL'},{col:colors.male,label:'Male'},{col:colors.female,label:'Female'}];
  let lx=pad.left;
  leg.forEach(l=>{
    svg+=`<rect x="${lx}" y="${H-pad.bottom+14}" width="10" height="10" fill="${l.col}" rx="2"/>`;
    svg+=`<text x="${lx+13}" y="${H-pad.bottom+23}" font-size="10" fill="#555">${l.label}</text>`;
    lx+=l.label.length*7+20;
  });

  svg+=`</svg>`;
  return svg;
}

    title:"The Deaf President Now Movement",
    passage:`The Deaf President Now (DPN) movement marked a growing shift in perceptions of deaf people.

Gallaudet University, in Washington D.C., was established as a school for deaf students. The founder convinced Congress to fund the school, and it eventually became an institution for higher learning. In a nod of support, U.S. President Ulysses S. Grant signed the Gallaudet diplomas. Future presidents continued the tradition, so all Gallaudet graduates receive diplomas signed by the U.S. President. Gallaudet University grew as a center for deaf education and advocacy.

In 1988, Gallaudet University was selecting a new university president. The board of trustees had well-qualified candidates, and all but one was deaf. On a Sunday, the board hastily announced they had selected the sole hearing candidate.

The reaction on campus was outrage. Students congregated to protest. Crowds marched to the meeting location and demanded an explanation. Through the closed-door discussion with protest leaders, a trustee created more discontent. He allegedly stated, "Deaf people are not able to function in a hearing world."

Throughout the week, there were more speeches and rallies. A media blitz spread the news globally. Students did not attend class to express their anger. Protest leaders formalized their demands, including a deaf president, the offending trustee must resign, the board of trustees must have 51% deaf leadership, and no reprisals against participants.

Support flowed in from across the world. The U.S. Vice President wrote, "Gallaudet has a responsibility to set an example and thus to appoint a president who is not only highly qualified, but who is also deaf."

After a week of peaceful protests, speeches, and news coverage, the newly appointed hearing president resigned. Students wore buttons that read 3½, indicating how many demands were left.

On the following Sunday, the board of trustees met again. Just a week after it began, the DPN movement was successful. All demands were met.`,

Beds: 9 | Baths: 8 | Half Baths: 4 | Square Feet: 13,072

Located on 124 Tulip Drive, just next to the glittering shine of the Atlantic Ocean, this 9-bedroom, 8-bathroom estate is waiting to be made into a home. Surrounded by well-kept grass, warm golden sand, and stunning foliage, this gem is a hidden treasure among the other homes on Tulip Drive. With wide open windows in nearly every room of the estate, this home allows a view of the beach and the ocean at any time of day. In it can be found not one, but two separate kitchens, both adorned with marble countertops, brand-new stainless-steel appliances, and plenty of space for cooking, drinking wine, or hosting dinner parties.

  {
    title:"Bedtime Story",
    passage:`Once upon a time there lived a frog named Frog. Frog had many neighbors, including Fish the fish and Willow the tree. But one day someone new arrived: a bright red ladybug with beautiful black spots.

Frog swam out of the lake. Frog hopped through the grass. Frog climbed up the hill.

  {
    title:"Groundhog Day",
    passage:`On February 2 of each year, the United States observes the unusual holiday of Groundhog Day, a day of hope that winter is over and spring is beginning. This tradition has been officially observed in the U.S. since the 1800s, and is believed to have developed from European folk traditions in which a bear, fox, badger, or even hedgehog would serve as the symbolic meteorologist. Although other cultures and towns observe Groundhog Day (or something similar), the town of Punxsutawney, Pennsylvania takes special pride in being home to the one true forecasting groundhog, Punxsutawney Phil. At the turn of the twentieth century, townspeople formed the Punxsutawney Groundhog Club to perpetuate the joyful rituals and events surrounding Groundhog Day. Over the years, these events have come to include a scavenger hunt, a talent show, and a ball.

Legend has it that on Groundhog Day the official weather forecasting groundhog awakens from hibernation and comes out of his burrow to look for his shadow. If he sees his shadow, six more weeks of winter are to come, and Punxsutawney Phil goes back to bed. However, if he does not see his shadow, Punxsutawney Phil takes this as a sign that spring has arrived, and he remains above ground. Of course, common sense tells us that February 2 is too early for spring to begin, and that while animals may be attuned to various elements of nature from which humans might learn, they are unlikely to act on their instincts based on a schedule set by a Gregorian calendar. Nevertheless, a visit to Pennsylvania to see Punxsutawney Phil and all of the fun he inspires each year might just provide the touch of hope needed to reach the end of winter.`,

    title:"Peanut Butter Cookies",
    passage:`Peanut Butter Cookies — Grandma Harry | 30 minutes | Cookies/Desserts | Makes 1 dozen

Ingredients:
1 egg white | 3/4 cup sugar | 1 cup peanut butter | 1 teaspoon vanilla | 1/2 cup flour

Directions:

// ─── BUILD ────────────────────────────────────────────────────────────────────
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildQuestions(){
  const list=[];
  READING_GROUPS.forEach(g=>{
    shuffle([...g.questions]).forEach(q=>list.push({subject:"Reading",passage:g.passage,passageTitle:g.title,chart:null,...q}));
  });
  shuffle([...STANDALONE_READING]).forEach(q=>list.push({subject:"Reading",passage:null,passageTitle:null,...q}));
  shuffle([...MATH_QUESTIONS]).forEach(q=>list.push({subject:"Math",passage:null,passageTitle:null,chart:null,...q}));
  shuffle([...SCIENCE_QUESTIONS]).forEach(q=>list.push({subject:"Science",passage:null,passageTitle:null,chart:null,...q}));
  shuffle([...ENGLISH_QUESTIONS]).forEach(q=>list.push({subject:"English",passage:null,passageTitle:null,chart:null,...q}));
  return list;
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let questions,current,selected,confirmed,score,wrong,subjectScores,answers;
let showingSectionEnd=false,sectionEndSubject=null;
let examComplete=false;
let explanations={}; // cache: question index -> explanation text

function init(){
  questions=buildQuestions();
  current=0;selected=null;confirmed=false;
  score=0;wrong=0;
  showingSectionEnd=false;sectionEndSubject=null;
  examComplete=false;
  explanations={};
  answers=new Array(questions.length).fill(null);
  subjectScores={Reading:{c:0,w:0},Math:{c:0,w:0},Science:{c:0,w:0},English:{c:0,w:0}};
  updateSidebar();render();
}

function restartQuiz(){
  init();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// ─── NAV ──────────────────────────────────────────────────────────────────────
function jumpToFinal(){
  if(!examComplete)return;
  showingSectionEnd=false;
  sectionEndSubject=null;
  current=questions.length;
  render();
}

function jumpToSubject(sub){
  const idx=questions.findIndex(q=>q.subject===sub);
  if(idx<0)return;
  // If this section is fully completed, show its results screen instead
  if(subjectDone(sub)){
    showingSectionEnd=true;
    sectionEndSubject=sub;
    // Position current at the first question of the NEXT section (or end), so "Continue" works correctly
    const nextIdx=questions.findIndex((q,i)=>i>idx && q.subject!==sub);
    current=nextIdx>=0?nextIdx:questions.length;
    render();
    return;
  }
  showingSectionEnd=false;
  sectionEndSubject=null;
  current=idx;
  selected=answers[current];
  confirmed=answers[current]!==null;
  render();
}

function subjectStart(sub){return questions.findIndex(q=>q.subject===sub);}
function subjectEnd(sub){
  let last=-1;
  questions.forEach((q,i)=>{if(q.subject===sub)last=i;});
  return last;
}
function subjectDone(sub){
  const end=subjectEnd(sub);
  return end>=0 && answers[end]!==null;
}

function updateSidebar(){
  const viewingFinal = examComplete && !showingSectionEnd && current>=questions.length;
  SUBJECT_ORDER.forEach(s=>{
    const btn=document.getElementById('nav-'+s);
    if(!btn)return;
    btn.className='nav-btn';
    let activeSub;
    if(viewingFinal){
      activeSub=null;
    }else if(showingSectionEnd){
      activeSub=sectionEndSubject;
    }else if(current<questions.length){
      activeSub=questions[current].subject;
    }else{
      activeSub=null;
    }
    if(s===activeSub)btn.className+=' active';
    else if(subjectDone(s))btn.className+=' done';
  });
  const finalBtn=document.getElementById('nav-Final');
  if(finalBtn){
    if(examComplete){
      finalBtn.style.display='';
      finalBtn.className='nav-btn'+(viewingFinal?' active':' done');
    }else{
      finalBtn.style.display='none';
    }
  }
  const hbadge=document.getElementById('hbadge');
  if(hbadge){
    if(viewingFinal)hbadge.textContent='Final Results';
    else if(showingSectionEnd)hbadge.textContent=sectionEndSubject+' Results';
    else if(current<questions.length)hbadge.textContent=questions[current].subject;
  }
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function subjectProgress(){
  if(current>=questions.length)return{num:0,total:0};
  const sub=questions[current].subject;
  const all=questions.filter(q=>q.subject===sub);
  const done=questions.slice(0,current).filter(q=>q.subject===sub).length;
  return{num:done+1,total:all.length};
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  updateSidebar();
  const app=document.getElementById('app');
  if(showingSectionEnd){renderSectionEnd(app);return;}
  if(current>=questions.length){renderFinal(app);return;}
  const q=questions[current];
  const sp=subjectProgress();
  const prog=Math.round(((sp.num-1)/sp.total)*100);

  // passage
  let passageHtml='';
  if(q.passage){
    passageHtml=`<div class="passage-box"><div class="passage-title">${esc(q.passageTitle)}</div><div class="passage-text">${esc(q.passage)}</div></div>`;
  }
  // chart
  let chartHtml='';
  if(q.chart==='choir'){
    chartHtml=`<div class="chart-wrap"><div class="chart-title">Percentage of Students in Grades 9–12 Who Participate in Choir, by Gender</div>${choirChartSVG()}</div>`;
  }

  // options
  let optsHtml=q.opts.map((o,i)=>{
    let cls='option-btn';
    if(confirmed){if(i===q.ans)cls+=' correct';else if(i===selected&&i!==q.ans)cls+=' incorrect';}
    else if(i===selected)cls+=' selected';
    return`<button class="${cls}" ${confirmed?'disabled':''} onclick="pick(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`;
  }).join('');

  let feedbackHtml='';
  if(confirmed){
    const isCorrect=selected===q.ans;
    const feedbackClass=isCorrect?'feedback right':'feedback wrong';
    const feedbackMsg=isCorrect
      ?`&#10003; Correct!`
      :`&#10007; Incorrect. The correct answer is: <strong>${String.fromCharCode(65+q.ans)}. ${esc(q.opts[q.ans])}</strong>`;

    let explanationHtml='';
    if(explanations[current]==='loading'){
      explanationHtml=`<div class="explanation-box"><div class="explanation-loading"><span class="exp-spinner"></span> Generating explanation…</div></div>`;
    }else if(explanations[current]){
      explanationHtml=`<div class="explanation-box"><div class="explanation-title">&#128218; Why this is the correct answer</div><div class="explanation-text">${explanations[current]}</div></div>`;
    }

    feedbackHtml=`<div class="${feedbackClass}">${feedbackMsg}</div>${explanationHtml}`;
  }

  const isLast=current===questions.length-1;
  let nextLabel=confirmed?(isLast?'See Results':'Next Question &#8594;'):'';

  const backDisabled=current===0?'disabled':'';

  app.innerHTML=
    `<div class="progress-wrap">
       <div class="progress-label"><span>Question ${sp.num} of ${sp.total}</span><span>${prog}%</span></div>
       <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${prog}%"></div></div>
     </div>`+
    passageHtml+chartHtml+
    `<p class="q-text">${esc(q.q)}</p>`+
    optsHtml+feedbackHtml+
    `<div class="btn-row">
       <button class="btn-back" onclick="goBack()" ${backDisabled}>&#8592; Back</button>
       ${!confirmed
         ?`<button class="btn-primary" onclick="confirm_ans()" ${selected===null?'disabled':''}>Confirm</button>`
         :`<button class="btn-secondary" onclick="next()">${nextLabel}</button>`}
     </div>`;
}

function renderSectionEnd(app){
  const sub=sectionEndSubject;
  // Collect this section's items
  const items=[];
  let c=0,w=0;
  questions.forEach((q,i)=>{
    if(q.subject!==sub)return;
    const a=answers[i];
    if(a===null)return;
    const correct=a===q.ans;
    if(correct)c++;else w++;
    items.push({q:q.q,opts:q.opts,ans:q.ans,given:a,correct});
  });
  const total=c+w;
  const pct=total>0?Math.round((c/total)*100):0;
  const color=pct>=80?'#1a6b4a':pct>=60?'#1a4db0':'#a02020';

  const rows=items.map(it=>{
    const icon=it.correct?'<span class="ri-icon c">&#10003;</span>':'<span class="ri-icon w">&#10007;</span>';
    const ansLine=it.correct
      ?`<div class="ri-ans"><b>${String.fromCharCode(65+it.ans)}. ${esc(it.opts[it.ans])}</b></div>`
      :`<div class="ri-ans">Your answer: <span>${String.fromCharCode(65+it.given)}. ${esc(it.opts[it.given])}</span> &nbsp;|&nbsp; Correct: <b>${String.fromCharCode(65+it.ans)}. ${esc(it.opts[it.ans])}</b></div>`;
    return`<div class="review-item">${icon}<div class="ri-q">${esc(it.q)}${ansLine}</div></div>`;
  }).join('');

  // Find next section
  const nextSub=current<questions.length?questions[current].subject:null;
  const continueLabel=nextSub?`Start ${nextSub} &#8594;`:'See Final Results &#8594;';

  app.innerHTML=
    `<div class="section-complete" style="text-align:center;padding:1.5rem 0 0.5rem;">
       <h2 style="font-size:20px;font-weight:600;margin-bottom:0.4rem;color:#1a1a1a;">${sub} Section Complete!</h2>
       <div style="font-size:56px;font-weight:700;color:${color};line-height:1;margin:0.5rem 0;">${pct}%</div>
       <div style="font-size:15px;color:#555;margin-bottom:1rem;">${c} of ${total} correct</div>
       <div class="results-pills" style="margin-bottom:1.5rem;">
         <span class="rpill s">&#10003; ${c} correct</span>
         <span class="rpill d">&#10007; ${w} incorrect</span>
       </div>
     </div>
     <hr style="border:none;border-top:1px solid #eee;margin-bottom:1.25rem;">
     <h3 style="font-size:14px;font-weight:600;color:#444;margin-bottom:1rem;">${sub} Review</h3>
     ${rows}
     <div class="btn-row" style="margin-top:1.5rem;">
       <button class="btn-back" onclick="goBack()">&#8592; Back</button>
       <button class="btn-primary" onclick="continueFromSectionEnd()">${continueLabel}</button>
     </div>`;

  // sidebar badge
  const hbadge=document.getElementById('hbadge');
  if(hbadge)hbadge.textContent=sub+' Results';
}

function renderFinal(app){
  examComplete=true;
  // recalculate from answers array to be accurate
  let totalC=0,totalW=0;
  const sc={Reading:{c:0,w:0,items:[]},Math:{c:0,w:0,items:[]},Science:{c:0,w:0,items:[]},English:{c:0,w:0,items:[]}};
  questions.forEach((q,i)=>{
    const a=answers[i];
    if(a===null)return;
    const correct=a===q.ans;
    if(correct){sc[q.subject].c++;totalC++;}else{sc[q.subject].w++;totalW++;}
    sc[q.subject].items.push({q:q.q,opts:q.opts,ans:q.ans,given:a,correct});
  });
  const total=totalC+totalW;

  // TEAS 7 approximate section weights (based on ATI scoring methodology)
  // Reading 31%, Math 22%, Science 31%, English 16%
  const WEIGHTS={Reading:0.31,Math:0.22,Science:0.31,English:0.16};

  // Composite: weighted average of section percentages
  let compositeNum=0, weightSum=0;
  SUBJECT_ORDER.forEach(s=>{
    const d=sc[s];const t=d.c+d.w;
    if(t>0){
      const p=(d.c/t)*100;
      compositeNum+=p*WEIGHTS[s];
      weightSum+=WEIGHTS[s];
    }
  });
  const composite=weightSum>0?Math.round((compositeNum/weightSum)*10)/10:0;

  // Raw percentage (all questions equal weight)
  const rawPct=total>0?Math.round((totalC/total)*100):0;

  // Composite color & proficiency label
  let compColor, proficiency;
  if(composite>=90){compColor='#1a6b4a';proficiency='Exemplary';}
  else if(composite>=78){compColor='#1a6b4a';proficiency='Advanced';}
  else if(composite>=65){compColor='#1a4db0';proficiency='Proficient';}
  else if(composite>=58){compColor='#b8860b';proficiency='Basic';}
  else{compColor='#a02020';proficiency='Developmental';}

  const breakdown=SUBJECT_ORDER.map(s=>{
    const d=sc[s];const t=d.c+d.w;const p=t>0?Math.round((d.c/t)*100):0;
    let color=p>=80?'#1a6b4a':p>=60?'#1a4db0':'#a02020';
    const weightPct=Math.round(WEIGHTS[s]*100);
    return`<div class="results-cell"><div class="rc-label">${s} <span style="color:#bbb;font-weight:400;">· ${weightPct}%</span></div><div class="rc-val" style="color:${color}">${p}%</div><div class="rc-sub">${d.c}/${t} correct</div></div>`;
  }).join('');

  // per-subject review
  let reviewHtml='';
  SUBJECT_ORDER.forEach(s=>{
    const items=sc[s].items;
    if(!items.length)return;
    const rows=items.map(it=>{
      const icon=it.correct?'<span class="ri-icon c">&#10003;</span>':'<span class="ri-icon w">&#10007;</span>';
      const ansLine=it.correct
        ?`<div class="ri-ans"><b>${String.fromCharCode(65+it.ans)}. ${esc(it.opts[it.ans])}</b></div>`
        :`<div class="ri-ans">Your answer: <span>${String.fromCharCode(65+it.given)}. ${esc(it.opts[it.given])}</span> &nbsp;|&nbsp; Correct: <b>${String.fromCharCode(65+it.ans)}. ${esc(it.opts[it.ans])}</b></div>`;
      return`<div class="review-item">${icon}<div class="ri-q">${esc(it.q)}${ansLine}</div></div>`;
    }).join('');
    reviewHtml+=`<div class="review-section"><h3>${s}</h3>${rows}</div>`;
  });

  app.innerHTML=
    `<div class="results-wrap">
       <div style="text-align:center;padding:1rem 0 1.5rem;background:linear-gradient(180deg,#f8f9ff 0%,transparent 100%);border-radius:14px;margin-bottom:1.5rem;">
         <div style="font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.5rem;">Adjusted Composite Score</div>
         <div style="font-size:72px;font-weight:700;color:${compColor};line-height:1;">${composite.toFixed(1)}%</div>
         <div style="display:inline-block;margin-top:0.75rem;padding:5px 16px;border-radius:20px;background:${compColor}15;color:${compColor};font-size:13px;font-weight:500;">${proficiency}</div>
         <div style="font-size:12px;color:#aaa;margin-top:0.75rem;">Weighted average · simulates ATI's scoring approach</div>
       </div>

       <div style="background:#fafafa;border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.5rem;">
         <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
           <span style="font-size:13px;color:#666;">Raw score (unweighted)</span>
           <span style="font-size:18px;font-weight:600;color:#1a1a1a;">${rawPct}%</span>
         </div>
         <div style="display:flex;gap:10px;justify-content:flex-start;">
           <span class="rpill s" style="font-size:12px;padding:4px 12px;">&#10003; ${totalC} correct</span>
           <span class="rpill d" style="font-size:12px;padding:4px 12px;">&#10007; ${totalW} incorrect</span>
         </div>
       </div>

       <h3 style="font-size:13px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.75rem;">Section breakdown</h3>
       <div class="results-grid">${breakdown}</div>

       <button class="btn-primary" style="margin-bottom:1.5rem;" onclick="restartQuiz()">&#8635; Start Over</button>
       <hr style="border:none;border-top:1px solid #eee;margin-bottom:1.25rem;">
       <h3 style="font-size:14px;font-weight:600;color:#444;margin-bottom:1rem;">Question Review</h3>
       ${reviewHtml}
       <button class="btn-primary" style="margin-top:1rem;" onclick="restartQuiz()">&#8635; Start Over</button>
     </div>`;

  // update sidebar
  SUBJECT_ORDER.forEach(s=>{
    const btn=document.getElementById('nav-'+s);
    if(btn){btn.className='nav-btn done';}
  });
  const hbadge=document.getElementById('hbadge');
  if(hbadge)hbadge.textContent='Final Results';
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function pick(i){if(confirmed)return;selected=i;render();}

function confirm_ans(){
  if(selected===null)return;
  confirmed=true;
  answers[current]=selected;
  const sub=questions[current].subject;
  if(selected===questions[current].ans){score++;subjectScores[sub].c++;}
  else{wrong++;subjectScores[sub].w++;}
  render();
  // Fetch explanation if not already cached
  if(explanations[current]===undefined){
    fetchExplanation(current);
  }
}

async function fetchExplanation(idx){
  const q=questions[idx];
  explanations[idx]='loading';
  render();

  const prompt=`You are a TEAS 7 exam tutor. A student just answered a multiple choice question.

Question: ${q.q}
${q.passage?'Passage context: '+q.passage.slice(0,600)+'...':''}
Correct answer: ${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}
${answers[idx]!==q.ans?'Student chose: '+String.fromCharCode(65+answers[idx])+'. '+q.opts[answers[idx]]:'The student got this right.'}

In 2-3 sentences, explain clearly and concisely WHY the correct answer is the best choice. Be direct and educational. Do not start with phrases like "Great question" or "Certainly". Just explain the reasoning.`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:prompt}]
      })
    });
    const data=await res.json();
    const text=data.content&&data.content[0]&&data.content[0].text?data.content[0].text:'';
    explanations[idx]=text||'Explanation unavailable.';
  }catch(e){
    explanations[idx]='Could not load explanation.';
  }
  // Only re-render if we're still on this question
  if(current===idx)render();
}

function next(){
  const prevSub=current<questions.length?questions[current].subject:null;
  current++;
  // Check if we just crossed a subject boundary (and aren't at the very end)
  if(current<questions.length && prevSub!==questions[current].subject){
    showingSectionEnd=true;
    sectionEndSubject=prevSub;
    render();
    return;
  }
  selected=answers[current]??null;
  confirmed=answers[current]!==null;
  render();
}

function continueFromSectionEnd(){
  showingSectionEnd=false;
  sectionEndSubject=null;
  selected=answers[current]??null;
  confirmed=answers[current]!==null;
  render();
}

function goBack(){
  // If we're viewing a section-end screen, back returns to the last question of that section
  if(showingSectionEnd){
    showingSectionEnd=false;
    sectionEndSubject=null;
    current--;
    selected=answers[current]??null;
    confirmed=answers[current]!==null;
    render();
    return;
  }
  if(current===0)return;
  // If back would cross a section boundary, show the section-end screen for the prior section instead
  const curSub=questions[current].subject;
  const prevSub=questions[current-1].subject;
  if(curSub!==prevSub){
    showingSectionEnd=true;
    sectionEndSubject=prevSub;
    render();
    return;
  }
  current--;
  selected=answers[current]??null;
  confirmed=answers[current]!==null;
  render();
}

init();

// Backup event listeners in case inline onclick is blocked
const _restartBtn = document.getElementById('restart-btn');
if (_restartBtn) {
  _restartBtn.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    restartQuiz();
  });
}
</script>
